<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD - Login</title>
<style>
body {
    background:#ffffff !important;
    color: #111827;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding:20px;
}
.box {
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 100%;
    max-width: 360px;
    border:1px solid #e5e7eb;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
h2{color:#111827;margin-bottom:15px;letter-spacing:1px}
input {
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    margin: 6px 0;
    width: 100%;
    outline: none;
    font-size:15px;
    box-sizing:border-box;
}
input:focus { border-color:#111827; }
button {
    padding: 13px 20px;
    background: #111827;
    color:#fff;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    width: 100%;
    margin-top: 12px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.1s;
}
button:active { transform: scale(0.98); opacity:0.9 }
button:disabled { opacity:0.6 }
.error{
    background:#fee2e2;
    color:#dc2626;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
    border:1px solid #fecaca;
    text-align:left;
}
a { text-decoration: none; }
.show-pass{
    font-size:12px;
    color:#6b7280;
    text-align:right;
    cursor:pointer;
    margin-top:4px;
    user-select:none;
}
.save-txt{font-size:11px;color:#10b981;margin-top:8px;font-weight:700}
</style>
</head>
<body>
<div class="box">
    <h2>🔒 LOGIN</h2>
    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}
    <form method="POST" action="/login" autocomplete="off" id="loginForm">
        <input type="text" name="username" id="username" placeholder="📱 Phone or Username" required autocomplete="off"><br>
        <input type="hidden" name="phone" id="phone_hidden">
        <input type="password" name="password" id="password" placeholder="🔑 Password" required autocomplete="new-password"><br>
        <div class="show-pass" onclick="togglePass()">👁️ Show Password</div>
        <button type="submit" id="loginBtn">LOGIN</button>
        <div class="save-txt">Automatically Data Save </div> 
    </form>
    <br>
    <a href="/register" style="color:#111827; font-weight:bold;">New Register</a>
    <br><br>
    <a href="/forgot" style="color:#ef4444; font-size:13px;">Forgot Password?</a>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(){
    document.getElementById('phone_hidden').value = document.getElementById('username').value;
    document.getElementById('loginBtn').innerText = 'LOADING...';
    document.getElementById('loginBtn').disabled = true;
});
function togglePass(){
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
}
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };
if(window.performance && performance.navigation.type == 2){
    location.reload(true);
}
</script>
</body>
</html>
