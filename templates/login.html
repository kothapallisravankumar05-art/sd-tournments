<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD - Login</title>
<style>
body {
    background: linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.9)), url('https://wallpapercave.com/wp/wp10551227.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0
}
.box {
    background: rgba(30,41,59,0.95);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 90%;
    max-width: 350px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,255,136,0.3)
}
input {
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 8px;
    width: 85%
}
button {
    padding: 12px 20px;
    background: #00ff88;
    border: none;
    border-radius: 8px;
    font-weight: 900;
    width: 90%;
    margin-top: 10px;
    cursor: pointer;
}
a { text-decoration: none; }
a:hover { text-decoration: underline; }
.small{font-size:12px; color:#00ff88; margin-top:10px; display:block;}
</style>
</head>
<body>
<div class="box">
    <h2>🔐 LOGIN</h2>
    <form method="POST" action="/login">
        <input type="text" name="phone" placeholder="Phone Number" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">LOGIN</button>
    </form>
    <span class="small">✅ Login 3650 days varaku gurthu untadi - Tab close chesina malli adagadu!</span>
    <br>
    <a href="/register" style="color:#00ff88; font-weight:bold;">New? Register</a>
    <br><br>
    <a href="/forgot" style="color:#ff4444; font-size:13px;">Forgot Password?</a>
</div>
</body>
</html>
