<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account - SD TOURNAMENT</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#e5e5e5;min-height:100vh}.top{background:#0a1931;color:white;padding:20px;text-align:center}.stats{background:#1e2a4a;color:white;display:flex;justify-content:space-around;padding:16px;border-radius:12px;margin:-25px 15px 15px 15px;text-align:center;box-shadow:0 5px 15px #0005}.menu{margin:10px 15px;background:white;border-radius:10px;padding:15px;display:flex;justify-content:space-between;color:#000;text-decoration:none;font-weight:600}</style>
</head>
<body>
<div class="top"><br><h2>Welcome Back,<br>{{ user.username }}</h2><p style="font-size:13px;color:#aaa">ID: {{ user.id }} | 📱 {{ user.phone }}</p><br><br></div>
<div class="stats"><div><b style="font-size:20px;color:gold">{{ played }}</b><br><small>Matches Played</small></div><div><b style="font-size:20px;color:#00ff88">{{ killed }}</b><br><small>Total Killed</small></div><div><b style="font-size:20px;color:gold">💰 {{ won }}</b><br><small>Amount Won</small></div></div>

<a href="/wallet" style="text-decoration:none"><div class="menu">💼 My Wallet - ₹{{ user.balance }} <span>></span></div></a>
<a href="/matches" style="text-decoration:none"><div class="menu">🎮 My Matches <span>></span></div></a>
<div class="menu" onclick="alert('Stats: Played {{ played }}, Kills {{ killed }}, Won ₹{{ won }}')">📊 My Statistics <span>></span></div>

<br><a href="/" style="display:block;text-align:center;background:#0a1931;color:white;padding:12px 20px;border-radius:20px;margin:15px;text-decoration:none;font-weight:900">⬅ Back to Play</a>
<a href="/logout" style="display:block;text-align:center;color:#ff4444;margin:10px;text-decoration:none">Logout</a>
</body>
</html>
