<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0}
.top{padding:25px;text-align:center;background:#1e293b}
.bal{font-size:42px;color:#ffde59;font-weight:900}
.card{background:white;color:black;margin:15px;border-radius:20px;padding:20px;text-align:center}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #ddd;margin:10px 0;box-sizing:border-box;font-size:16px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;color:white;font-size:16px}
.pay{background:#5a00ff}
#qr{margin:15px auto;display:flex;justify-content:center}
.withdraw-btn{display:block;background:#f43f5e;color:white;padding:16px;border-radius:12px;text-decoration:none;font-weight:900;margin:15px;text-align:center;font-size:16px;border:2px solid #ff6b81}
.withdraw-info{color:#aaa;font-size:12px;margin-top:-10px;margin-bottom:10px}
</style>
</head><body>
<div class="top"><p style="color:#aaa">Wallet Balance</p><div class="bal">₹ {{ user['balance'] }}</div>
<!-- WITHDRAW BUTTON - FIX -->
<a href="/withdraw" class="withdraw-btn">💸 WITHDRAW MONEY (Min ₹100)</a>
<p class="withdraw-info">Minimum withdrawal Rs.100 | 24hrs lo UPI ki vasthadi</p>
</div>

<div class="card">
<h3>Scan & Pay - Manual Verify</h3>
<input id="amt" type="number" placeholder="Amount - Ex: 100">
<button class="btn pay" onclick="genQR()">GENERATE UPI QR & PAY</button>

<div id="area" style="display:none">
<div id="qr"></div>
<p id="orderTxt" style="color:gray;font-size:12px"></p>

<input id="utr" placeholder="12 Digit UTR Number kotu">
<button class="btn" style="background:#00c851;margin-top:10px" onclick="submitUTR()">SUBMIT FOR VERIFY</button>
<p style="color:red;font-size:11px;margin-top:10px">Manam verify chesi 5 mins lo add chestam!</p>
<p id="msg" style="color:#5a00ff;font-weight:900"></p>
</div>
</div>
<a href="/" style="display:block;text-align:center;color:#ffde59;text-decoration:none;margin:20px;font-weight:700">← Back to Matches</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
let finalAmt = 0;
function genQR(){
  let a = document.getElementById('amt').value;
  if(!a || a < 10){ alert('Min 10 Rs bro!'); return; }
  finalAmt = a;
  let myUPI = "9550043870@ibl";
  let upiLink = `upi://pay?pa=${myUPI}&pn=SD%20Tournaments&am=${a}&cu=INR&tn=SD${Date.now()}`;
  document.getElementById('area').style.display='block';
  document.getElementById('orderTxt').innerText = `Pay ₹${a}`;
  document.getElementById('qr').innerHTML = "";
  new QRCode(document.getElementById('qr'), {text: upiLink, width: 200, height: 200});
}

function submitUTR(){
  let utr = document.getElementById('utr').value;
  if(utr.length < 6){ alert('Valid UTR kotu bro!'); return; }
  fetch('/add-money', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({amount: finalAmt, utr: utr})
  }).then(r=>r.json()).then(d=>{
    document.getElementById('msg').innerText = d.msg;
  });
}
</script>
</body></html>
