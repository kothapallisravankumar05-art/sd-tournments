<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Money - SD</title>
</head>
<body style="background:#0a1628;color:white;font-family:sans-serif;text-align:center;padding:20px">
<h2 style="color:gold">💰 Add Money</h2>
<p style="color:#888;font-size:13px">Min ₹10 - UTR unique undali</p>
<input type="number" id="amt" placeholder="Amount Ex: 100" style="padding:15px;width:85%;border-radius:10px;border:none;font-size:18px;text-align:center;max-width:350px"><br><br>
<button onclick="payUPI()" style="background:#00ff88;color:black;padding:15px 50px;border:none;border-radius:12px;font-size:20px;font-weight:bold;cursor:pointer">PAY WITH UPI</button>
<div id="box" style="margin-top:25px"></div>
<script>
function payUPI(){
 let a=document.getElementById('amt').value;
 if(!a || a<10){alert("Min 10rs bro");return}
 document.getElementById('box').innerHTML="<p style='color:gold'>Loading UPI Link...</p>";
 fetch('/get_upi_link?amount='+a).then(r=>r.json()).then(d=>{
   if(!d.ok){alert("Error - Try again");return}
   window.location.href=d.upi_link;
   document.getElementById('box').innerHTML=`<div style="background:#162435;padding:20px;border-radius:15px;max-width:380px;margin:0 auto;border:1px solid #00ff88">
   <p style="color:#00ff88;font-weight:bold">✅ PhonePe/GPay open ayindi!</p><p style="color:#aaa;font-size:13px">Pay chesi, UTR copy chesi ikkada paste chey</p>
   <input id="utr" placeholder="12 digit UTR pettu" style="padding:14px;width:90%;border-radius:8px;border:none;text-align:center;font-weight:bold;letter-spacing:1px;text-transform:uppercase"><br><br>
   <button onclick="verify()" style="background:gold;color:black;padding:14px 40px;border-radius:10px;font-weight:900;border:none;cursor:pointer">✅ VERIFY PAYMENT</button>
   <p style="color:#666;font-size:11px;margin-top:10px">Same UTR vere vallu vadithe block avuthundi!</p></div>`;
 });
}
function verify(){
 let u=document.getElementById('utr').value.trim().toUpperCase();
 let a=document.getElementById('amt').value;
 if(u.length<10){alert("Correct 12 digit UTR pettu bro");return}
 document.getElementById('box').innerHTML="<p style='color:gold'>Verifying...</p>";
 fetch('/verify_upi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:a,utr:u})})
 .then(r=>r.json()).then(d=>{
   alert(d.msg);
   if(d.ok){
     location.href='/wallet';
   } else {
     // Fake UTR ayite malla try cheyaniki box chupinchu
     payUPI();
     setTimeout(()=>{
       let inp = document.getElementById('utr');
       if(inp) inp.value = "";
     },500);
   }
 })
 .catch(()=>alert("Network Error - Malla try chey"));
}
</script>
<br><br>
<a href="/wallet" style="color:#888">← Back to Wallet</a>
</body>
</html>
