<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f172a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#1e293b;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center}
input{width:100%;padding:15px;border-radius:12px;border:none;margin:12px 0;box-sizing:border-box;font-size:16px;text-align:center;letter-spacing:5px}
button{width:100%;padding:15px;background:#5a00ff;color:white;border:none;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div class="box">
<h3>OTP Verify</h3>
<p style="color:#aaa">{{ phone }} ki OTP pampamu</p>
<div style="background:#0f172a;padding:15px;border-radius:12px;margin:15px 0;border:1px dashed #ffde59">
<small style="color:#aaa">DEMO OTP</small>
<h1 style="color:#ffde59;margin:5px 0">{{ otp }}</h1>
</div>
<form method="POST" action="/verify">
<input name="otp" placeholder="Enter OTP" maxlength="6" required>
<button type="submit">VERIFY & LOGIN ✅</button>
</form>
</div>
</body>
</html>
