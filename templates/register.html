<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD - Register</title>
<style>
body {
    background: linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.9)), url('https://wallpapercave.com/wp/wp10551227.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0
}
.box {
    background: rgba(30,41,59,0.95);
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 90%;
    max-width: 350px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0,255,136,0.3)
}
input {
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 8px;
    width: 85%;
    outline: none
}
input:focus {
    box-shadow: 0 0 8px #00ff88
}
button {
    padding: 12px 20px;
    background: #00ff88;
    border: none;
    border-radius: 8px;
    font-weight: 900;
    width: 90%;
    margin-top: 10px;
    cursor: pointer;
    font-size: 16px
}
button:active {
    transform: scale(0.98)
}
a { text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
    <h2>📝 REGISTER</h2>
    <form method="POST" action="/register">
        <input type="tel" name="phone" placeholder="10 Digit Phone" pattern="[0-9]{10}" maxlength="10" required><br>
        <input type="text" name="username" placeholder="Username / Free Fire Name" required><br>
        <input type="password" name="password" placeholder="Password" minlength="4" required><br>
        <button type="submit">REGISTER</button>
    </form>
    <br>
    <a href="/login" style="color:#00ff88; font-weight:bold;">Already have account? Login</a>
</div>
</body>
</html>
