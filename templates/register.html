<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD - Register</title>
<style>
body {
    background:#ffffff !important;
    color: #111827;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding:20px;
}
.box {
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 100%;
    max-width: 360px;
    border:1px solid #e5e7eb;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
h2{color:#111827;margin-bottom:15px;letter-spacing:1px}
input {
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    margin: 6px 0;
    width: 100%;
    outline: none;
    font-size:15px;
    box-sizing:border-box;
}
input:focus { border-color:#111827; }
button {
    padding: 13px 20px;
    background: #111827;
    color:#fff;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    width: 100%;
    margin-top: 12px;
    cursor: pointer;
    font-size: 16px;
    transition:0.1s;
}
button:active { transform: scale(0.98); }
button:disabled { opacity:0.6; }
a { text-decoration: none; }
.small{font-size:12px; color:#065f46; margin-top:12px; display:block;background:#d1fae5;padding:10px;border-radius:8px;border:1px solid #a7f3d0}
.error{
    background:#fee2e2;
    color:#dc2626;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
    border:1px solid #fecaca;
    text-align:left;
}
.show-pass{
    font-size:12px;
    color:#6b7280;
    text-align:right;
    cursor:pointer;
    margin-top:4px;
    user-select:none;
}
</style>
</head>
<body>
<div class="box">
    <h2>📝 REGISTER</h2>

    {% if error %}
    <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" autocomplete="off" id="regForm">
        <input type="tel" name="phone" id="phone" placeholder="📱 10 Digit Phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="off"><br>
        <input type="text" name="username" id="username" placeholder="🎮 Username / Free Fire Name" required autocomplete="off"><br>
        <input type="password" name="password" id="password" placeholder="🔑 Password (min 4)" minlength="4" required autocomplete="new-password"><br>
        <div class="show-pass" onclick="togglePass()">👁️ Show Password</div>
        <button type="submit" id="regBtn">REGISTER</button>
    </form>

    <span class="small">🎁 Referral bonus ₹20 - Join Link Using Refer Id ₹20!</span>

    <br>
    <a href="/login" style="color:#111827; font-weight:bold;">Already have account? Login</a>
</div>

<script>
document.getElementById('regForm').addEventListener('submit', function(e){
    const phone = document.getElementById('phone').value.trim();
    if(!/^[0-9]{10}$/.test(phone)){
        e.preventDefault();
        alert('Phone 10 digits undali bro! 9550043870 la');
        return false;
    }
    document.getElementById('regBtn').innerText = 'CREATING...';
    document.getElementById('regBtn').disabled = true;
});

function togglePass(){
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
}

// BACK BUTTON FIX
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };
if(window.performance && performance.navigation.type == 2){
    location.reload(true);
}
</script>

</body>
</html>
