<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SD - Register</title>
<style>
body {
    background:#ffffff !important; /* Dark image teesesam - Full white */
    color: #111827;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding:20px;
}
.box {
    background: #ffffff;
    padding: 30px;
    border-radius: 16px;
    text-align: center;
    width: 100%;
    max-width: 360px;
    border:1px solid #e5e7eb;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
h2{color:#111827;margin-bottom:15px}
input {
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
    margin: 6px 0;
    width: 100%;
    outline: none;
    font-size:15px;
    box-sizing:border-box;
}
input:focus {
    border-color:#111827;
}
button {
    padding: 13px 20px;
    background: #111827;
    color:#fff;
    border: none;
    border-radius: 10px;
    font-weight: 900;
    width: 100%;
    margin-top: 12px;
    cursor: pointer;
    font-size: 16px
}
button:active {
    transform: scale(0.98)
}
a { text-decoration: none; }
.small{font-size:12px; color:#065f46; margin-top:10px; display:block;background:#d1fae5;padding:8px;border-radius:8px;}
.error{
    background:#fee2e2;
    color:#dc2626;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
    border:1px solid #fecaca;
}
</style>
</head>
<body>
<div class="box">
    <h2>📝 REGISTER</h2>

    <!-- ERROR BOX - Username Already Exists -->
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" autocomplete="off">
        <input type="tel" name="phone" placeholder="📱 10 Digit Phone" pattern="[0-9]{10}" maxlength="10" required><br>
        <input type="text" name="username" placeholder="🎮 Username / Free Fire Name" required><br>
        <input type="password" name="password" placeholder="🔑 Password" minlength="4" required><br>
        <button type="submit">REGISTER</button>
    </form>

    <span class="small">🎁 Referral bonus ₹20 - Join Link Using Refer Id ₹20!</span>

    <br>
    <a href="/login" style="color:#111827; font-weight:bold;">Already have account? Login</a>
</div>

<script>
// BACK BUTTON BUG FIX - Register ayaka back nokkithe malla register ki radu
history.pushState(null, null, location.href);
window.onpopstate = function () {
    history.go(1);
};
if(window.performance && performance.navigation.type == 2){
    location.reload(true);
}
</script>

</body>
</html>
