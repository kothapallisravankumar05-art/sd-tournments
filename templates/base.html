<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SD Tournaments - Esports Battle</title>
    
    <link rel="manifest" href="/static/manifest.json?v=2">
    <link rel="icon" type="image/png" href="/static/icon.png?v=2">
    <link rel="apple-touch-icon" href="/static/icon.png?v=2">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #FFD700; margin: 0; }
        .navbar {
            background: linear-gradient(90deg, #000, #1a1a1a);
            border-bottom: 2px solid #FFD700;
            padding-top: calc(8px + env(safe-area-inset-top));
            position: sticky; top: 0; z-index: 1000;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/" id="secretAdminLogo">
                <img src="/static/icon.png?v=2" alt="SD" width="35" height="35" style="border-radius:50%;">
                <strong style="color:#FFD700;"> SD TOURNAMENTS</strong>
            </a>
            <div>
                <a href="/login" class="btn btn-outline-warning btn-sm">Login</a>
                <a href="/register" class="btn btn-warning btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="padding-bottom: 80px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
// FIXED: Tabs & PWA both working
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js')
      .then(() => console.log('SW OK'));
  });
}
    </script>

    <script>
// FIXED: Logo click - Normal click goes to home instantly, 5 clicks = admin
let logoClicks = 0;
let clickTimer;
const logo = document.getElementById('secretAdminLogo');
logo.addEventListener('click', function(e) {
    logoClicks++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
    
    if (logoClicks >= 5) {
        e.preventDefault();
        logoClicks = 0;
        if (navigator.vibrate) navigator.vibrate(100);
        window.location.href = '/admin';
    }
    // For 1-4 clicks, DO NOT preventDefault - Let it go to "/" normally
});
    </script>
</body>
</html>
