<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SD Tournaments - Esports Battle</title>
    
    <link rel="manifest" href="/static/manifest.json?v=2">
    <link rel="icon" type="image/png" href="/static/icon.png?v=2">
    <link rel="apple-touch-icon" href="/static/icon.png?v=2">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            margin: 0;
            /* FIX FOR TAB CLICK BLOCK */
            padding-top: 0 !important;
        }
        .navbar {
            background: linear-gradient(90deg, #000, #1a1a1a);
            border-bottom: 2px solid #FFD700;
            padding-top: calc(8px + env(safe-area-inset-top)) !important;
            position: sticky;
            top: 0;
            z-index: 9999 !important;
        }
        /* Ensure buttons clickable */
        .navbar a, .btn {
            pointer-events: auto !important;
            position: relative;
            z-index: 10000;
        }
        .container.mt-4 {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/" id="secretAdminLogo">
                <img src="/static/icon.png?v=2" alt="SD" width="35" height="35" style="border-radius:50%;">
                <strong style="color:#FFD700;"> SD TOURNAMENTS</strong>
            </a>
            <div>
                <a href="/login" class="btn btn-outline-warning btn-sm" style="pointer-events:auto;">Login</a>
                <a href="/register" class="btn btn-warning btn-sm" style="pointer-events:auto;">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="padding-bottom: 80px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    console.log("SD App Loaded")
    </script>

    <script>
    let logoClicks = 0;
    let clickTimer;
    const logo = document.getElementById('secretAdminLogo');
    logo.addEventListener('click', function(e) {
        logoClicks++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
        if (logoClicks >= 5) {
            e.preventDefault();
            logoClicks = 0;
            if (navigator.vibrate) navigator.vibrate(100);
            window.location.href = '/admin';
        } else if (logoClicks === 1) {
            setTimeout(() => {
                if (logoClicks === 1) window.location.href = '/';
            }, 400);
            e.preventDefault();
        } else {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
