<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SD Tournaments - Esports Battle</title>
    
    <!-- App Icon & PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SD Tournaments">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #FFD700;
            padding-top: env(safe-area-inset-top);
            padding-top: constant(safe-area-inset-top);
            margin: 0;
        }
        .navbar {
            background: linear-gradient(90deg, #000, #1a1a1a);
            border-bottom: 2px solid #FFD700;
            padding-top: calc(12px + env(safe-area-inset-top)) !important;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        #secretAdminLogo {
            cursor: pointer;
            user-select: none;
        }
        @supports (padding-top: env(safe-area-inset-top)) {
            body { padding-top: env(safe-area-inset-top); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/" id="secretAdminLogo">
                <img src="/static/icon.png" alt="SD" width="35" height="35" style="border-radius:50%;">
                <strong style="color:#FFD700;"> SD TOURNAMENTS</strong>
            </a>
            <div>
                <a href="/login" class="btn btn-outline-warning btn-sm">Login</a>
                <a href="/register" class="btn btn-warning btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="padding-bottom: 80px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- PWA Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW failed'));
      });
    }
    </script>

    <!-- SECRET ADMIN LOGIN - 5 CLICKS ON LOGO -->
    <script>
    let logoClicks = 0;
    let clickTimer;
    const logo = document.getElementById('secretAdminLogo');
    
    logo.addEventListener('click', function(e) {
        // Normal click unte home ki vellakunda 5 clicks ayye varaku aapu
        logoClicks++;
        
        // Reset after 3 seconds
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
        
        if (logoClicks >= 5) {
            e.preventDefault();
            logoClicks = 0;
            // Vibrate effect for admin entry
            if (navigator.vibrate) navigator.vibrate(100);
            window.location.href = '/admin';
        } else if (logoClicks === 1) {
            // First click - go home after small delay if not multi-clicking
            setTimeout(() => {
                if (logoClicks === 1) window.location.href = '/';
            }, 400);
            e.preventDefault();
        } else {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
