<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SD Tournaments - Esports Battle</title>
    
    <link rel="manifest" href="/static/manifest.json?v=3">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png?v=3">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icon-192.png?v=3">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/icon-512.png?v=3">
    <meta name="theme-color" content="#00ff88">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SD TOUR">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Daily Free Fire & BGMI Tournaments - Win Cash Prizes">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #FFD700; margin: 0; }
        .navbar {
            background: linear-gradient(90deg, #000, #1a1a1a);
            border-bottom: 2px solid #FFD700;
            padding-top: calc(8px + env(safe-area-inset-top));
            position: sticky; top: 0; z-index: 1000;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/" id="secretAdminLogo">
                <img src="/static/icon-192.png?v=3" alt="SD" width="35" height="35" style="border-radius:50%;">
                <strong style="color:#FFD700;"> SD TOURNAMENTS</strong>
            </a>
            <div>
                <a href="/login" class="btn btn-outline-warning btn-sm">Login</a>
                <a href="/register" class="btn btn-warning btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" style="padding-bottom: 80px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
// FIXED: Tabs & PWA both working - v3
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/static/sw.js?v=3')
      .then(reg => {
        console.log('SW OK v3');
        // Auto update SW
        reg.onupdatefound = () => {
          const newSW = reg.installing;
          newSW.onstatechange = () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('New SW available - reload to update');
            }
          };
        };
      })
      .catch(err => console.log('SW fail', err));
  });
  
  // Handle PWA install prompt - fixes "App can't install"
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('PWA Install Ready - Chrome will show install button');
  });
}
    </script>

    <script>
// FIXED: Logo click - Normal click goes to home instantly, 5 clicks = admin
let logoClicks = 0;
let clickTimer;
const logo = document.getElementById('secretAdminLogo');
logo.addEventListener('click', function(e) {
    logoClicks++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { logoClicks = 0; }, 3000);
    
    if (logoClicks >= 5) {
        e.preventDefault();
        logoClicks = 0;
        if (navigator.vibrate) navigator.vibrate([100,50,100]);
        window.location.href = '/admin';
    }
    // For 1-4 clicks, DO NOT preventDefault - Let it go to "/" normally
});
    </script>
</body>
</html>
