<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password - SD TOURNAMENT</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.card{background:#1a1a1a;padding:25px;border-radius:15px;width:100%;max-width:380px;border:1px solid #333;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#222;color:#fff;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:900;margin-top:10px;cursor:pointer}
a{color:#00ff88;text-decoration:none;font-size:13px}
h2{color:gold}
</style>
</head>
<body>
<div class="card">
<h2>🔑 Forgot Password?</h2>
<p style="color:#888;font-size:12px;margin-bottom:15px">Nee username/phone enter chesi new password pettu - Instant reset!</p>
<form method="POST">
<input name="username" placeholder="Username / Phone Number" required>
<input name="new_password" type="password" placeholder="New Password" required>
<button class="btn">RESET PASSWORD</button>
</form>
<br>
<a href="/login">← Back to Login</a>
</div>
</body>
</html>
